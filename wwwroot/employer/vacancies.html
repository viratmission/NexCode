<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vacancies · MatchPoint</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/forms.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body class="app-body auth-pending">
    <div class="app-shell">
        <div id="sidebar"></div>

        <div class="app-main">
            <div id="header"></div>

            <main class="app-content">
                <div class="page-header">
                    <div>
                        <h1 class="page-header__title">Vacancies</h1>
                        <p class="page-header__description">Create, edit and close the roles you are hiring for.</p>
                    </div>
                    <div class="page-header__actions">
                        <a class="btn btn--primary" href="/employer/vacancy-form.html">Post a vacancy</a>
                    </div>
                </div>

                <section class="card mb-6">
                    <div class="card__body card__body--tight">
                        <form class="filter-bar" id="vacancyFilters">
                            <div class="form-field toolbar__grow">
                                <label class="form-label" for="search">Search</label>
                                <div class="input-group">
                                    <svg class="input-group__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg>
                                    <input class="form-control" type="search" id="search" name="search"
                                           placeholder="Job title or skill" />
                                </div>
                            </div>

                            <div class="form-field">
                                <label class="form-label" for="location">Location</label>
                                <input class="form-control" type="text" id="location" name="location"
                                       placeholder="Any location" />
                            </div>

                            <div class="form-field">
                                <label class="form-label" for="statusFilter">Status</label>
                                <select class="form-control" id="statusFilter" name="statusFilter">
                                    <option value="">All statuses</option>
                                    <option value="Open">Open</option>
                                    <option value="Closed">Closed</option>
                                </select>
                            </div>

                            <div class="form-field">
                                <label class="form-label">&nbsp;</label>
                                <div class="flex gap-2">
                                    <button type="submit" class="btn btn--primary flex-1">Search</button>
                                    <button type="button" class="btn btn--secondary" id="resetFilters">Reset</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </section>

                <p class="text-sm text-secondary mb-4" id="resultsSummary"></p>

                <div id="vacancyList"></div>
                <div class="mt-6" id="vacancyPagination"></div>
            </main>
        </div>
    </div>

    <script defer src="/js/config/apiConfig.js"></script>
    <script defer src="/js/utilities/formatters.js"></script>
    <script defer src="/js/utilities/validators.js"></script>
    <script defer src="/js/utilities/domHelpers.js"></script>
    <script defer src="/js/auth/tokenManager.js"></script>
    <script defer src="/js/components/toast.js"></script>
    <script defer src="/js/components/loader.js"></script>
    <script defer src="/js/components/modal.js"></script>
    <script defer src="/js/components/statusBadge.js"></script>
    <script defer src="/js/components/matchScore.js"></script>
    <script defer src="/js/components/pagination.js"></script>
    <script defer src="/js/services/apiClient.js"></script>
    <script defer src="/js/services/authService.js"></script>
    <script defer src="/js/services/profileService.js"></script>
    <script defer src="/js/services/jobService.js"></script>
    <script defer src="/js/services/applicationService.js"></script>
    <script defer src="/js/services/employerService.js"></script>
    <script defer src="/js/services/contactRequestService.js"></script>
    <script defer src="/js/services/notificationService.js"></script>
    <script defer src="/js/services/adminService.js"></script>
    <script defer src="/js/auth/authGuard.js"></script>
    <script defer src="/js/auth/roleGuard.js"></script>
    <script defer src="/js/components/sidebar.js"></script>
    <script defer src="/js/components/header.js"></script>
    <script defer src="/js/pages/employer-vacancies.js"></script>
</body>
</html>
