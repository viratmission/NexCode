<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Access denied · MatchPoint</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/authentication.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body class="auth-body">
    <main class="status-page">
        <div class="status-card">
            <div class="status-card__icon status-card__icon--danger">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg>
            </div>
            <div class="status-card__code">403 &middot; Forbidden</div>
            <h1 class="status-card__title">You do not have access to this page</h1>
            <p class="status-card__text" id="forbiddenMessage">
                This area is reserved for a different role. If you believe this is a mistake, contact an
                administrator.
            </p>
            <div class="status-card__actions">
                <a class="btn btn--primary btn--lg" id="homeLink" href="/index.html">Go to my dashboard</a>
                <button type="button" class="btn btn--secondary btn--lg" id="signOutButton">Sign out</button>
            </div>
        </div>
    </main>

    <script defer src="/js/config/apiConfig.js"></script>
    <script defer src="/js/utilities/formatters.js"></script>
    <script defer src="/js/utilities/domHelpers.js"></script>
    <script defer src="/js/auth/tokenManager.js"></script>
    <script defer src="/js/pages/forbidden.js"></script>
</body>
</html>
